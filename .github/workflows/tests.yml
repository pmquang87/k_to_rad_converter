name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        # Use bash on every runner (incl. Windows) so the install/skip-guard
        # shell snippets below behave identically across the matrix.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional scientific dependencies
        # The core converter is pure stdlib, but the modal eigensolve,
        # random-vibration/fatigue and fast --auto-gapmin tests need numpy/scipy
        # (and lasso-python for the d3plot export). Without these the most
        # numerically complex tests silently self-skip. numpy/scipy are required;
        # lasso-python is best-effort (no wheels on some Python versions).
        #
        # On Windows we deliberately skip lasso-python to avoid slow/flaky
        # scientific-wheel installs — only the two d3plot-export tests self-skip;
        # the skip guard below lists every skip that makes up its threshold.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "coverage[toml]"
          if [ "${{ runner.os }}" != "Windows" ]; then
            python -m pip install lasso-python || echo "lasso-python unavailable on this Python; d3plot export tests will skip"
          fi
      - name: Run test suite with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=68
      - name: Fail if too many tests were skipped
        # Guard against the scientific deps silently dropping out again (a
        # missing numpy+scipy skips 61 more tests: 63 measured at fcf0989 with
        # neither numpy, scipy nor lasso, the two lasso tests among them).
        # The threshold is the Windows count, and every skip in it is NAMED
        # here - none of them is a numpy/scipy gate (16 = 2 + 13 + 1, measured
        # in run 37147823345):
        #   2 lasso-python-gated (lasso is deliberately not installed on Windows):
        #     test_converter.ModalShapesExportTests.test_d3plot_roundtrip
        #     test_converter.ModalShapesExportTests.test_rewrite_does_not_append_states
        #   13 corpus-gated (FEM_solver tree or F: decks that CI does not have):
        #     test_preload_inistate.CorpusCarrierTests (2)
        #     test_r14_triage_2.ModalBeamMassArm (2)
        #     test_r14_triage_6.ConstrainedGlobalBcs.test_7_the_corpus_carriers_select_LS_DYNAs_own_nodes (F:)
        #     test_rare_materials.CorpusCarrierTests (2)
        #     test_side_defects.TestTwoDLagCarrier (4)
        #     test_tiebreak_rupture.CorpusCarriers (2)
        #   1 F:-gated (R14 round 7; EXP_SC_JOINT_SCREW.k is 699 KB, no fixture):
        #     test_r14_triage_7.JointScrewGjoint.test_the_F_deck
        # lasso-python installs on ubuntu, so the count there is 14. A NEW
        # corpus- or package-gated test pushes Windows over 16: give it a
        # repo-local fixture to run on in CI, or raise the threshold AND add
        # the test to this list - never raise the number alone.
        run: |
          skips=$(python -m unittest discover -s tests 2>&1 | grep -oE 'skipped=[0-9]+' | grep -oE '[0-9]+' || echo 0)
          echo "skipped tests: ${skips:-0}"
          if [ "${skips:-0}" -gt 16 ]; then
            echo "::error::${skips} tests skipped (>16) — scientific dependencies may be missing, or a new corpus-gated test needs a fixture (see the list above)"
            exit 1
          fi

  typecheck:
    # BLOCKING as of PR #134: the advisory baseline was burned down 194 -> 0, so
    # a new finding is a real regression and fails the job.
    #
    # mypy is PINNED, unlike ruff in the lint job below, which floats: an
    # advisory check that goes red on a new tool release costs nothing, a
    # blocking one breaks master on a rule that did not exist when the burn-down
    # was measured. THIS LINE IS THE ONLY PIN — pyproject.toml's `dev` extra
    # lists mypy unpinned on purpose, so a contributor's local floating mypy can
    # report a finding CI does not without master going red on its own. Bump the
    # pin here deliberately and re-run the burn-down; do not add a second pin to
    # the extra.
    #
    # Deliberately mypy-only: the package declares no runtime dependencies, and
    # `ignore_missing_imports` covers the two optional imports in gapmin.py.
    # Installing numpy here would CHANGE the finding count (numpy ships inline
    # types) — before PR #134's gapmin fix the two environments disagreed by 17
    # findings (194 with site-packages, 211 without, both on master 6060946).
    # Reproduce this environment locally with `mypy --no-site-packages k2rad`;
    # both must be clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: python -m pip install "mypy==2.3.1"
      - name: Type-check k2rad
        run: mypy k2rad

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff lint
        run: ruff check .
